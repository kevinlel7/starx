<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>socials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font-family: "Pixelify Sans", "Courier New", monospace;
    }
    #hearts { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    main {
      position: relative;
      z-index: 1;
      width: max-content;
      text-align: center;
      transform: translateY(-4px);
    }
    #toggle {
      appearance: none;
      border: 0;
      background: none;
      color: inherit;
      margin: 0;
      padding: 0;
      font: inherit;
      font-weight: 600;
      font-size: 44px;
      line-height: 1;
      cursor: pointer;
    }
    .dot { position: relative; display: inline-block; }
    .dot::after {
      content: "";
      position: absolute;
      left: 50%;
      top: .03em;
      width: 14px;
      height: 12px;
      transform: translateX(-50%);
      background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 6' shape-rendering='crispEdges'><path fill='%23ff7d9c' d='M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z'/></svg>") center / contain no-repeat;
    }
    .list {
      position: relative;
      margin-top: 22px;
      display: grid;
      gap: 22px;
      text-align: left;
    }
    .list a {
      justify-self: center;
      color: #111;
      text-decoration: none;
      font-weight: 500;
      font-size: 19px;
      line-height: 22px;
      white-space: nowrap;
      visibility: hidden;
      clip-path: inset(0 100% 0 0);
      pointer-events: none;
    }
    .list a span { margin-left: 10px; font-size: 16px; color: #777; }
    .list a.going { visibility: visible; }
    .list a.in { visibility: visible; clip-path: none; pointer-events: auto; }
    #bunny {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 1;
      width: 44px;
      height: 36px;
      opacity: 0;
      pointer-events: none;
      transform-origin: 50% 100%;
      transition: opacity .12s;
      image-rendering: pixelated;
    }
    #bunny.on { opacity: 1; }
    a:focus-visible, button:focus-visible { outline: 1px dotted #777; outline-offset: 5px; }
  </style>
</head>
<body>
  <canvas id="hearts"></canvas>
  <main id="socials">
    <button id="toggle" type="button" aria-expanded="false" aria-label="socials">soc<span class="dot">ı</span>als</button>
    <div class="list">
      <img id="bunny" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABYAAAASCAYAAABfJS4tAAAApUlEQVR42s1UsQ3DIBA8EI1nMIWpzCbZIDtmg4wClV3YK7j9VC/ZCJQ3jiOu45CO4+4BOIF+GKkfRpLyYlEiou31PoiUeI2b0I5w93yIeC3Nd5nC18KWKYA5U3PN9JCfRGGdF3HtlLePgZ3molGlsmpytc5jnaPKlpebgJrsTeqwRpTBbgFAs8Mrgn990mado7LOE+4Gf4OMdF3aSydJPG5nigOAD5DkgMXf0VbZAAAAAElFTkSuQmCC" alt="">
      <a href="https://discord.com" target="_blank">discord <span>starlesxs</span></a>
      <a href="https://www.twitch.tv/starlesxs" target="_blank">twitch <span>starlesxs</span></a>
      <a href="https://twitter.com/starlesxs" target="_blank">twitter <span>starlesxs</span></a>
    </div>
  </main>
  <script>
    const main = document.getElementById('socials')
    const toggle = document.getElementById('toggle')
    const bunny = document.getElementById('bunny')
    const links = [...document.querySelectorAll('.list a')]
    const hoverable = matchMedia('(hover: hover) and (pointer: fine)')

    // tweak these
    const W = 44, H = 36
    const hop = { gap: 70, height: 22, ms: 400 }
    const drop = { height: 26, ms: 780 }
    const pick = { height: 14, ms: 320 }

    let run = 0, pickRun = 0, raf = 0
    let open = false, ready = false
    let pos = { x: 0, y: 0 }

    function spot(a) {
      const left = a.offsetLeft, width = a.offsetWidth
      return { a, left, width, y: a.offsetTop + a.offsetHeight - H + 3, start: left - W - 4, end: left + width + 4 }
    }

    function place(x, y, sx = 1, sy = 1, dir = 1) {
      pos = { x, y }
      bunny.style.transform = `translate(${x}px, ${y}px) scale(${sx * dir}, ${sy})`
    }

    function squish(p) {
      const k = Math.max(0, 1 - Math.min(p, 1 - p) / .14)
      return [1 + .14 * k, 1 - .18 * k]
    }

    const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2

    function animate(ms, fn, alive) {
      return new Promise(done => {
        const t0 = performance.now()
        const tick = now => {
          if (!alive()) return done(false)
          const t = Math.min(1, (now - t0) / ms)
          fn(t)
          if (t < 1) raf = requestAnimationFrame(tick)
          else done(true)
        }
        raf = requestAnimationFrame(tick)
      })
    }

    // bounce across a link, uncovering it as we go
    function cross(s, id) {
      const dist = s.end - s.start
      const n = Math.max(2, Math.round(dist / hop.gap))
      s.a.classList.add('going')
      return animate(n * hop.ms, t => {
        const x = s.start + dist * t
        const p = (t * n) % 1
        place(x, s.y - hop.height * Math.sin(Math.PI * p), ...squish(p))
        const seen = Math.max(0, Math.min(s.width, x + W / 2 - s.left))
        s.a.style.clipPath = `inset(-4px ${s.width - seen}px -4px -4px)`
      }, () => id === run).then(ok => {
        if (ok) { s.a.style.clipPath = ''; s.a.classList.add('in') }
        return ok
      })
    }

    function jump(x2, y2, ms, height, alive) {
      const x1 = pos.x, y1 = pos.y
      const dir = x2 < x1 - 1 ? -1 : 1
      return animate(ms, t => {
        const e = ease(t)
        const [sx, sy] = squish(t)
        place(x1 + (x2 - x1) * e, y1 + (y2 - y1) * e - height * Math.sin(Math.PI * t), sx, sy, dir)
      }, alive).then(ok => {
        if (ok) place(x2, y2)
        return ok
      })
    }

    function pickLink(a) {
      if (!ready) return
      const s = spot(a)
      if (Math.abs(pos.x - s.start) < .5 && Math.abs(pos.y - s.y) < .5) return
      const me = ++pickRun, id = run
      cancelAnimationFrame(raf)
      jump(s.start, s.y, pick.ms, pick.height, () => me === pickRun && id === run)
    }

    async function show() {
      if (open) return
      open = true
      toggle.setAttribute('aria-expanded', 'true')
      const id = ++run
      const spots = links.map(spot)
      const last = spots[spots.length - 1]

      place(spots[0].start, spots[0].y)
      bunny.classList.add('on')
      await new Promise(r => setTimeout(r, 250))
      for (let i = 0; i < spots.length; i++) {
        if (!await cross(spots[i], id)) return
        const next = spots[i + 1]
        if (next && !await jump(next.start, next.y, drop.ms, drop.height, () => id === run)) return
      }
      if (!await jump(last.start, last.y, drop.ms, drop.height, () => id === run)) return

      ready = true
      const over = links.find(a => a.matches(':hover') || a === document.activeElement)
      if (over) pickLink(over)
    }

    function hide() {
      if (!open) return
      open = ready = false
      run++
      pickRun++
      cancelAnimationFrame(raf)
      toggle.setAttribute('aria-expanded', 'false')
      bunny.classList.remove('on')
      links.forEach(a => { a.classList.remove('in', 'going'); a.style.clipPath = '' })
    }

    links.forEach(a => {
      a.addEventListener('mouseenter', () => pickLink(a))
      a.addEventListener('focus', () => pickLink(a))
    })

    toggle.addEventListener('mouseenter', () => { if (hoverable.matches) show() })
    main.addEventListener('mouseleave', () => { if (hoverable.matches) hide() })
    toggle.addEventListener('click', e => {
      if (hoverable.matches && e.detail > 0) return
      open ? hide() : show()
    })

    // hearts
    const cv = document.getElementById('hearts')
    const ctx = cv.getContext('2d')
    const heart = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...']
    const pinks = ['#f6a9b8', '#ff9fb8', '#ffc4d2']
    let vw = 0, vh = 0, hearts = []

    function newHeart(anywhere) {
      const px = 2 + Math.floor(Math.random() * 3)
      return {
        px,
        x: Math.random() * vw,
        y: anywhere ? Math.random() * vh : -px * 6 - Math.random() * 80,
        speed: 18 + Math.random() * 30 + px * 4,
        sway: 6 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        swaySpeed: .6 + Math.random() * .8,
        color: pinks[Math.floor(Math.random() * pinks.length)],
        alpha: .35 + Math.random() * .35,
      }
    }

    function resize() {
      const dpr = devicePixelRatio || 1
      vw = innerWidth
      vh = innerHeight
      cv.width = Math.round(vw * dpr)
      cv.height = Math.round(vh * dpr)
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      while (hearts.length < 30) hearts.push(newHeart(true))
    }

    let prev = performance.now()
    function fall(now) {
      const dt = Math.min(.05, (now - prev) / 1000)
      prev = now
      ctx.clearRect(0, 0, vw, vh)
      for (const h of hearts) {
        h.y += h.speed * dt
        h.phase += h.swaySpeed * dt
        if (h.y > vh + 10) Object.assign(h, newHeart(false))
        const x = Math.round(h.x + Math.sin(h.phase) * h.sway), y = Math.round(h.y)
        ctx.globalAlpha = h.alpha
        ctx.fillStyle = h.color
        heart.forEach((row, r) => [...row].forEach((c, i) => {
          if (c === '#') ctx.fillRect(x + i * h.px, y + r * h.px, h.px, h.px)
        }))
      }
      ctx.globalAlpha = 1
      requestAnimationFrame(fall)
    }

    addEventListener('resize', resize)
    resize()
    requestAnimationFrame(fall)
  </script>
</body>
</html>
